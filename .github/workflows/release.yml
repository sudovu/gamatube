name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_release:
    name: Build & Package Releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Web
        run: flutter build web --release

      - name: Package Web
        run: cd build/web && zip -r ../../GAMATUBE-Web.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GAMATUBE-Web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
