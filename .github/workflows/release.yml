name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_android_and_web:
    name: Build Android APK & Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android APK
        run: flutter build apk --split-per-abi --release

      - name: Build Web
        run: flutter build web --release

      - name: Package Web
        run: cd build/web && zip -r ../../GAMATUBE-Web.zip .

      - name: Copy Android APK
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk GAMATUBE-arm64.apk

      - name: Publish Android & Web
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GAMATUBE-arm64.apk
            GAMATUBE-Web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build_ios:
    name: Build iOS IPA
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS Application (Release)
        run: flutter build ios --release --no-codesign

      - name: Package Payload to .IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r ../../../GAMATUBE-iOS.ipa Payload
          cd ../../..

      - name: Publish iOS IPA
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GAMATUBE-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
